<!DOCTYPE html>
<html lang="fr" class="w2m-sidepanel">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawl Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app dashboard">
    <header class="app-header">
      <div class="header-left">
        <button class="btn-icon hidden" id="dash-back-btn" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </button>
        <span class="app-title" id="dash-site"></span>
      </div>
      <div class="header-actions">
        <span class="badge badge--stopped" id="dash-badge" role="status"></span>
        <button class="btn-icon" id="dash-settings-btn" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
        <button class="btn-icon" id="dash-theme-btn" aria-label="Theme">
          <svg id="dash-theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </div>
    </header>
    <div class="mode-tabs" id="mode-tabs" role="tablist">
      <button class="mode-tab" id="tab-single" role="tab" aria-controls="dash-single-view" aria-selected="false"></button>
      <button class="mode-tab" id="tab-crawl" role="tab" aria-controls="dash-crawl-view" aria-selected="true"></button>
    </div>
    <div id="dash-single-view" class="hidden app-body" role="tabpanel" aria-labelledby="tab-single"></div>
    <div id="dash-crawl-view" role="tabpanel" aria-labelledby="tab-crawl">
    <main class="app-body" id="dash-monitor">
      <div class="progress-bar mb-3">
        <div class="progress-fill" id="dash-progress-fill" style="width:0%"></div>
      </div>
      <div class="progress-info"><span id="dash-speed" class="text-muted"></span><span id="dash-elapsed"
          class="text-muted"></span></div>
      <div class="stat-grid mt-3">
        <div class="stat-card stat-card--success">
          <div class="stat-value" id="dash-captured">0</div>
          <div class="stat-label" id="lbl-captured"></div>
        </div>
        <div class="stat-card stat-card--info">
          <div class="stat-value" id="dash-queued">0</div>
          <div class="stat-label" id="lbl-queued"></div>
        </div>
        <div class="stat-card stat-card--error">
          <div class="stat-value" id="dash-blocked">0</div>
          <div class="stat-label" id="lbl-blocked"></div>
        </div>
      </div>
      <div id="dash-debug" class="dash-debug hidden" aria-label="Crawl debug"></div>
      <div class="section-label mt-4" id="lbl-activity"></div>
      <div class="activity-list" id="dash-activity" role="log" aria-live="polite"></div>
      <div class="section-label mt-4 hidden" id="lbl-errors"></div>
      <div id="dash-errors" class="hidden"></div>
    </main>
    <div class="app-body view-settings hidden" id="dash-settings"></div>
    <footer class="app-footer" id="dash-footer">
      <button class="btn btn-secondary btn-sm" id="dash-retry-all" disabled></button>
      <div style="flex:1"></div>
      <button class="btn btn-secondary btn-sm btn-icon" id="dash-pause" aria-label="Pause">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" />
          <rect x="14" y="4" width="4" height="16" />
        </svg>
      </button>
      <button class="btn btn-danger btn-sm btn-icon" id="dash-stop" aria-label="Stop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2" />
        </svg>
      </button>
      <button class="btn btn-secondary btn-sm btn-icon" id="dash-reset" aria-label="Reset" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
        </svg>
      </button>
    </footer>
    </div><!-- /#dash-crawl-view -->
    <div class="toast-container" id="toast-container"></div>
  </div>
  <script src="js/cleanup-markdown.js"></script>
  <script src="js/markdown-output.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/single-conversion-result.js"></script>
  <script src="js/theme-icon.js"></script>
  <script src="js/default-settings.js"></script>
  <script src="js/format-shortcut.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
