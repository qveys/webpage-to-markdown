<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>body { max-width: 500px; margin: 0 auto; }</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <img src="img/icon.png" width="20" height="20" alt="">
        <span class="app-title" id="settings-title"></span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="settings-theme-btn" aria-label="Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>
    <main class="app-body" id="settings-container"></main>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/app-state.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/settings-page.js"></script>
</body>
</html>
