version: 2
updates:
  # Test dependencies (Jest)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      jest:
        patterns:
          - "jest*"
          - "@types/jest"
    commit-message:
      prefix: chore
      include: scope
    labels:
      - "📦 Type: Dependency"
      - "🧩 Area: Tests"
      - "🤖 Source: Dependabot"
      - "🟨 Lang: JavaScript"
      - "⏱️ Effort: Small"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    target-branch: main
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
    labels:
      - "📦 Type: Dependency"
      - "🧩 Area: CI"
      - "🤖 Source: Dependabot"
      - "⏱️ Effort: Small"
