name: ✨ Feature request
description: Suggest a new capability or improvement.
labels:
  - "🚀 Type: Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What user pain or workflow gap motivates this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? UI mock-ups, flow diagrams, or examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they did not fit.
  - type: dropdown
    id: browsers
    attributes:
      label: Target browsers
      multiple: true
      options:
        - Chrome
        - Edge
        - Firefox
