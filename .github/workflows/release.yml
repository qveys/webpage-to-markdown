name: Release

# On tag v*, create/update GitHub Release with packed extension bundles for
# Chrome, Firefox, and Edge. Inspired by qveys/tm-exclusions/release.yml.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch manifest.json with tag version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - name: Build Chrome bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="webpage-to-markdown-chrome-v${VERSION}.zip"
          zip -r "$ZIP" . \
            -x ".git/*" \
               ".github/*" \
               "tests/*" \
               "node_modules/*" \
               "package.json" \
               "package-lock.json" \
               ".gitignore" \
               "CLAUDE.md" \
               "AGENTS.md" \
               "docs/*" \
               ".remember/*" \
               "manifest.firefox.json"
          echo "ZIP_CHROME=$ZIP" >> "$GITHUB_ENV"

      - name: Build Edge bundle (= Chrome)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="webpage-to-markdown-edge-v${VERSION}.zip"
          cp "$ZIP_CHROME" "$ZIP"
          echo "ZIP_EDGE=$ZIP" >> "$GITHUB_ENV"

      - name: Build Firefox bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="webpage-to-markdown-firefox-v${VERSION}.zip"
          if [ -f manifest.firefox.json ]; then
            cp manifest.firefox.json manifest.json
            jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
            mv manifest.tmp manifest.json
          fi
          zip -r "$ZIP" . \
            -x ".git/*" \
               ".github/*" \
               "tests/*" \
               "node_modules/*" \
               "package.json" \
               "package-lock.json" \
               ".gitignore" \
               "CLAUDE.md" \
               "AGENTS.md" \
               "docs/*" \
               ".remember/*" \
               "manifest.firefox.json"
          echo "ZIP_FIREFOX=$ZIP" >> "$GITHUB_ENV"

      - name: Compute SHA256 sums
        run: |
          for ZIP in "$ZIP_CHROME" "$ZIP_EDGE" "$ZIP_FIREFOX"; do
            sha256sum "$ZIP" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "webpage-to-markdown $TAG"
            gh release upload "$TAG" \
              "$ZIP_CHROME" "$ZIP_EDGE" "$ZIP_FIREFOX" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "webpage-to-markdown $TAG" \
              --generate-notes \
              "$ZIP_CHROME" "$ZIP_EDGE" "$ZIP_FIREFOX" SHA256SUMS.txt
          fi
