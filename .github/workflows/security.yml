name: Security

# Run npm audit against PRs and pushes to main. Works on private repos without
# GitHub Advanced Security (dependency-review-action requires GHAS).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit (high+ severity blocks)
        run: npm audit --audit-level=high
