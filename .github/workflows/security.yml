name: Security

# Run npm audit against PRs and pushes to main. Works on private repos without
# GitHub Advanced Security (dependency-review-action requires GHAS).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit (high+ severity blocks)
        run: npm audit --audit-level=high
