name: Security

# Run npm audit against PRs and pushes to main. Works on private repos without
# GitHub Advanced Security (dependency-review-action requires GHAS).

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit (high+ severity blocks)
        # Dev-only chain (jest > glob > minimatch > brace-expansion) is unfixable
        # upstream today (only brace-expansion 5.0.8 is patched); this repo has
        # zero production dependencies, so audit prod scope strictly.
        run: npm audit --omit=dev --audit-level=high
