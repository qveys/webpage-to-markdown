name: Tests

# pull_request has no paths filter: `test` is a required status check on main's
# ruleset, and a required check tied to a path-filtered workflow never posts a
# status for PRs outside those paths (e.g. docs-only PRs), leaving it "expected"
# forever and blocking merge. The workflow starts for every PR to main;
# the test job is skipped for fork PRs.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, openclaw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
