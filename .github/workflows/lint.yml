name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.ico'
      - 'img/**'
      - 'docs/screenshots/**'
      - 'docs/superpowers/**'
      - 'beta/**'
      - 'privacy/**'
      - 'support/**'
      - '.remember/**'
      - '.claude/**'
      - '.cursor/**'
      - '*.html'
      - 'manifest.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      # tmp: empirical check — base=main, isolated lint.yml diff; revert before merge

permissions:
  contents: read

jobs:
  prettier:
    name: prettier
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  eslint:
    name: eslint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  stylelint:
    name: stylelint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:css

  markdownlint:
    name: markdownlint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
