name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.ico'
      - 'img/**'
      - 'docs/screenshots/**'
      - 'docs/superpowers/**'
      - 'beta/**'
      - 'privacy/**'
      - 'support/**'
      - '.remember/**'
      - '.claude/**'
      - '.cursor/**'
      - '*.html'
      - 'manifest.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.nojekyll'
      - '.prettierignore'
      - '.github/CODEOWNERS'
      - '.github/labels.yml'
      - '.github/labeler.yml'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      # None of the 4 lint tools check other workflow files (prettier's
      # format:check only lists lint.yml among workflow files) — ignore each
      # one explicitly so lint.yml itself keeps triggering this workflow.
      # NOTE: a '.github/workflows/**' + '!.github/workflows/lint.yml' pair
      # was tried first but empirically does NOT re-include lint.yml (verified
      # via a throwaway PR isolated to a lint.yml-only diff: the workflow
      # never triggered) — GitHub's negation-in-paths-ignore docs example
      # apparently doesn't hold here, so list every sibling file by name
      # instead. Add new workflow files here as they're created.
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/sync-labels.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/triage.yml'
      # tmp: empirical re-check of the explicit-list fix (isolated lint.yml
      # diff); revert before merge

permissions:
  contents: read

jobs:
  prettier:
    name: prettier
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  eslint:
    name: eslint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  stylelint:
    name: stylelint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:css

  markdownlint:
    name: markdownlint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
