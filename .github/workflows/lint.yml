name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.ico'
      - 'img/**'
      - 'docs/screenshots/**'
      - 'docs/superpowers/**'
      - 'beta/**'
      - 'privacy/**'
      - 'support/**'
      - '.remember/**'
      - '.claude/**'
      - '.cursor/**'
      - '*.html'
      - 'manifest.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.nojekyll'
      - '.prettierignore'
      - 'package-lock.json'
      - '.github/CODEOWNERS'
      - '.github/labels.yml'
      - '.github/labeler.yml'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/*.yml'
      # None of the 4 lint tools check other workflow files (prettier's
      # format:check only lists lint.yml among workflow files) — ignore the
      # whole directory, then un-ignore lint.yml so changes to it still lint.
      # ORDER MATTERS: GitHub evaluates path-filter patterns sequentially, so
      # the '!' negation below only re-includes lint.yml because it comes
      # AFTER '.github/workflows/**'. Do not alphabetize or otherwise reorder
      # this pair, or lint.yml changes will silently stop triggering this
      # workflow.
      - '.github/workflows/**'
      - '!.github/workflows/lint.yml'

permissions:
  contents: read

jobs:
  prettier:
    name: prettier
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  eslint:
    name: eslint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  stylelint:
    name: stylelint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:css

  markdownlint:
    name: markdownlint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
